<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Daily Tracker</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#217346">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{
  --bg:#eef1ee;--cell:#ffffff;--ink:#1d2520;--mute:#6f7a73;--grid:#cfd6d0;
  --hdr:#217346;--hdr-ink:#ffffff;--accent:#217346;--accent-soft:#dcefe3;
  --wknd:#f3f5f3;--today:#fff4c2;--sel:#e4f1ea;--na:#e9ece9;--warn:#c0392b;--foot:#e3ece6;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#141816;--cell:#1d2320;--ink:#e8ede9;--mute:#94a099;--grid:#34403a;
  --hdr:#1d6b41;--hdr-ink:#ffffff;--accent:#4fbf86;--accent-soft:#1f3a2c;
  --wknd:#232b27;--today:#3d3718;--sel:#25382e;--na:#2a312d;--warn:#ef7b6d;--foot:#26332b;}
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 Calibri,"Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
.wrap{max-width:1250px;margin:0 auto;padding:12px 10px 50px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px;justify-content:space-between;margin-bottom:10px}
h1{font-size:19px;margin:0;font-weight:700}
.month{display:flex;align-items:center;gap:6px}
.month .label{min-width:140px;text-align:center;font-weight:700;font-size:16px}
button{font:inherit;color:inherit;background:var(--cell);border:1px solid var(--grid);border-radius:6px;padding:6px 11px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.ghost{border:none;background:none;color:inherit;opacity:.75;padding:2px 5px}
button.ghost:hover{opacity:1}
.status{font-size:12px;color:var(--mute)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
.stat{background:var(--cell);border:1px solid var(--grid);border-radius:6px;padding:6px 9px;min-width:0}
.stat b{display:block;font-size:18px}
.stat span{font-size:11px;color:var(--mute)}
@media(max-width:520px){.stats{gap:5px}.stat{padding:5px 6px}.stat b{font-size:15px}.stat span{font-size:10px;line-height:1.2;display:block}}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
.bar input[type=text],.bar select{font:inherit;color:inherit;background:var(--cell);border:1px solid var(--grid);border-radius:6px;padding:6px 8px;min-width:0}
.bar input[type=text]{flex:1 1 160px}
.bar .sp{flex:1}
.hint{font-size:12px;color:var(--mute)}

/* ---- the sheet ---- */
.sheet{overflow:auto;max-height:68vh;border:1px solid var(--grid);background:var(--cell);border-radius:4px}
table{border-collapse:separate;border-spacing:0;min-width:100%;font-size:13px}
th,td{border-right:1px solid var(--grid);border-bottom:1px solid var(--grid);padding:0;height:30px;background:var(--cell);white-space:nowrap}
thead th{position:sticky;top:0;z-index:3;background:var(--hdr);color:var(--hdr-ink);font-weight:600;height:34px;padding:0 6px;text-align:center;min-width:92px}
thead th.corner,tbody td.day{position:sticky;left:0;z-index:4;min-width:78px;width:78px}
thead th.corner{z-index:6;text-align:left;padding-left:8px}
tbody td.day{z-index:2;background:var(--wknd);font-weight:600;padding:0 8px;cursor:pointer;color:var(--ink)}
tbody tr.wk td{background:var(--wknd)}
tbody tr.tdy td{background:var(--today)}
tbody tr.sel td{background:var(--sel)}
tbody tr.sel td.day{box-shadow:inset 3px 0 var(--accent)}
tbody tr.tdy td.day{background:var(--today)}
td.ck{text-align:center}
td.ck input{width:17px;height:17px;accent-color:var(--accent);cursor:pointer;vertical-align:middle;margin:0}
td.na{background:repeating-linear-gradient(135deg,var(--na) 0 4px,transparent 4px 8px)!important;cursor:pointer}
td.dn{text-align:center;color:var(--mute);min-width:56px;font-size:12px}
td.sp input,td.nt input{width:100%;height:29px;border:0;background:transparent;color:inherit;font:inherit;padding:0 7px;outline:none}
td.sp input{text-align:right;min-width:92px}
td.nt input{min-width:170px}
td.sp input.bad{color:var(--warn);background:rgba(192,57,43,.12)}
td.sp input::placeholder{color:var(--mute);opacity:.45}
td.sp:focus-within,td.nt:focus-within{outline:2px solid var(--accent);outline-offset:-2px}
tfoot td{position:sticky;bottom:0;z-index:3;background:var(--foot);font-weight:700;text-align:center;height:32px;border-top:2px solid var(--hdr)}
tfoot td.day{left:0;z-index:5;text-align:left;padding:0 8px;cursor:default}
.hd{display:flex;align-items:center;justify-content:center;gap:2px}
.hd .nm{background:none;border:none;color:inherit;font:inherit;font-weight:600;padding:2px 4px;max-width:120px;overflow:hidden;text-overflow:ellipsis;cursor:text}
.hd input{width:100px;font:inherit;padding:2px 4px;border-radius:4px;border:1px solid #fff;color:#000}
.hd button.ghost{color:#fff}
.empty{color:var(--mute);text-align:center;padding:24px 10px}

/* ---- login + footer ---- */
.card{background:var(--cell);border:1px solid var(--grid);border-radius:10px;padding:16px}
.loginbox{max-width:380px;margin:12vh auto 0;text-align:center}
.loginbox h1{font-size:24px;margin-bottom:6px}
.loginbox p{color:var(--mute);margin:0 0 20px}
.gbtn{display:inline-flex;align-items:center;gap:10px;padding:11px 18px;font-weight:600;border-radius:8px}
.err{color:var(--warn);font-size:13px;margin-top:12px;min-height:18px}
.foot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:20px;padding-top:12px;border-top:1px solid var(--grid);font-size:13px;color:var(--mute)}
.foot .sp{flex:1}
</style>
</head>
<body>
<div class="wrap" id="loading"><div class="empty">Loading…</div></div>

<div class="wrap" id="login" hidden>
  <div class="card loginbox">
    <h1>My Daily Tracker</h1>
    <p>Daily tasks and expenses, saved to your account.</p>
    <button id="gsign" class="gbtn" type="button">
      <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.2C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.4c-.5 2.9-2.2 5.3-4.6 6.9l7.4 5.8c4.3-4 6.9-9.9 6.9-17.2z"/><path fill="#FBBC05" d="M10.5 28.6c-.5-1.4-.8-2.9-.8-4.6s.3-3.2.8-4.6l-7.9-6.2C.9 16.4 0 20.1 0 24s.9 7.6 2.6 10.8l7.9-6.2z"/><path fill="#34A853" d="M24 48c6.3 0 11.6-2.1 15.5-5.7l-7.4-5.8c-2.1 1.4-4.8 2.3-8.1 2.3-6.3 0-11.6-4.1-13.5-9.9l-7.9 6.2C6.5 42.6 14.6 48 24 48z"/></svg>
      Continue with Google
    </button>
    <div class="err" id="lerr"></div>
  </div>
</div>

<div class="wrap" id="appRoot" hidden>
  <header>
    <h1>My Daily Tracker</h1>
    <div class="month">
      <button id="prev" aria-label="Previous month">←</button>
      <div class="label" id="mlabel"></div>
      <button id="next" aria-label="Next month">→</button>
      <button id="now" class="ghost">Today</button>
    </div>
    <div class="status" id="status"></div>
  </header>
  <main id="view"></main>
  <div class="foot">
    <span id="who"></span><span class="sp"></span>
    <button id="exp" type="button">Export backup</button>
    <button id="imp" type="button">Import backup</button>
    <input id="impf" type="file" accept="application/json" hidden>
    <button id="out" type="button">Sign out</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, onAuthStateChanged, GoogleAuthProvider, signInWithPopup, signOut } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { initializeFirestore, getFirestore, persistentLocalCache, persistentMultipleTabManager, doc, collection, setDoc, getDoc, getDocs, onSnapshot } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDg3wi9f80kDwH5Ano4e6qokenHHL4IAD8",
  authDomain: "my-tracker1-e12cd.firebaseapp.com",
  projectId: "my-tracker1-e12cd",
  storageBucket: "my-tracker1-e12cd.firebasestorage.app",
  messagingSenderId: "638714042761",
  appId: "1:638714042761:web:6cbf42f3dbd6eec784a958"
};
const fbApp = initializeApp(firebaseConfig);
const auth = getAuth(fbApp);
let fs;
try { fs = initializeFirestore(fbApp, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) }); }
catch (e) { fs = getFirestore(fbApp); }

if ('serviceWorker' in navigator) { window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {})); }

(function(){
  const MN=['January','February','March','April','May','June','July','August','September','October','November','December'];
  const DW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const $=s=>document.querySelector(s);
  const now=new Date();
  let Y=now.getFullYear(), M=now.getMonth();
  let selDay=now.getDate();
  let data={tasks:[],exp:{}};
  let db=null, uid=null, unsub=null, saving=false, timer=null, loadTimer=null;
  const pending={};
  let delArm=null, editId=null, wantScroll=true;

  const mkey=(y,m)=>`m-${y}-${String(m+1).padStart(2,'0')}`;
  const key=()=>mkey(Y,M);
  const dim=()=>new Date(Y,M+1,0).getDate();
  const isThisMonth=()=>Y===now.getFullYear()&&M===now.getMonth();
  const fmt=n=>(Math.round(n*100)/100).toLocaleString('en-IN',{maximumFractionDigits:2});
  const uidn=()=>Math.random().toString(36).slice(2,9);
  const el=(t,props,...kids)=>{const e=document.createElement(t);if(props)Object.assign(e,props);kids.forEach(k=>e.append(k));return e;};

  /* ---------- data helpers ---------- */
  function normalize(d){
    d=d||{};
    const arr=a=>Array.isArray(a)?a.map(Number):[];
    const tasks=Array.isArray(d.tasks)?d.tasks.map(t=>{
      const legacy=t.every===undefined&&t.on===undefined;
      return {id:String(t.id||uidn()),n:String(t.n||''),d:arr(t.d),every:legacy?true:!!t.every,from:+t.from||1,on:arr(t.on),x:arr(t.x)};
    }):[];
    const exp={};
    const src=(d.exp&&typeof d.exp==='object')?d.exp:{};
    for(const k of Object.keys(src)){
      const v=src[k];
      if(Array.isArray(v)){               // older format: list of entries
        if(!v.length) continue;
        const e=v.map(x=>+x.a||0).join('+');
        const n=v.map(x=>x.t).filter(t=>t&&t!=='Expense'&&t!=='No spending').join(', ');
        exp[k]={e,n};
      } else if(v&&typeof v==='object'){
        exp[k]={e:String(v.e==null?'':v.e),n:String(v.n==null?'':v.n)};
      }
    }
    return {tasks,exp};
  }
  function applies(t,d){return t.on.includes(d)||(t.every&&d>=t.from&&!t.x.includes(d));}
  function evalExpr(s){
    s=String(s==null?'':s).trim().replace(/^=/,'');
    if(!s) return null;
    if(!/^[0-9+\-*/().\s]+$/.test(s)) return NaN;
    try{const v=Function('"use strict";return ('+s+')')();return (typeof v==='number'&&isFinite(v))?v:NaN;}catch(e){return NaN;}
  }
  const spentOf=d=>{const x=data.exp[d];const v=x?evalExpr(x.e):null;return (v==null||isNaN(v))?0:v;};
  const logged=d=>{const x=data.exp[d];return !!(x&&String(x.e||'').trim()!=='');};
  function localGet(k){try{const s=localStorage.getItem('trk:'+(uid||'')+':'+k);return s?normalize(JSON.parse(s)):null;}catch(e){return null;}}
  function localSet(k,v){try{localStorage.setItem('trk:'+(uid||'')+':'+k,JSON.stringify(v));}catch(e){}}

  /* ---------- saving ---------- */
  function setStatus(s){$('#status').textContent=s;}
  function touch(){
    pending[key()]=data;
    localSet(key(),data);
    setStatus(db&&uid?'Saving…':'Saved on this device');
    clearTimeout(timer); timer=setTimeout(flush,500);
  }
  async function flush(){
    if(saving) return;
    const keys=Object.keys(pending);
    if(!keys.length) return;
    saving=true;
    let ok=true;
    for(const k of keys){
      const d=pending[k]; delete pending[k];
      try{
        if(db&&uid) await db.collection('data/users/'+uid).doc(k).set(JSON.parse(JSON.stringify(d)));
      }catch(e){ok=false;}
    }
    saving=false;
    if(Object.keys(pending).length) return flush();
    setStatus(db&&uid?(ok?'Saved ✓':'Sync failed — kept on this device'):'Saved on this device');
  }

  /* ---------- loading ---------- */
  function load(){
    if(unsub){unsub();unsub=null;}
    data=pending[key()]||localGet(key())||{tasks:[],exp:{}};
    wantScroll=true;
    render();
    if(!(db&&uid)) return;
    clearTimeout(loadTimer);
    loadTimer=setTimeout(()=>setStatus('Can’t reach saved data yet…'),10000);
    const k=key();
    unsub=db.collection('data/users/'+uid).doc(k).onSnapshot(snap=>{
      if(k!==key()) return;
      if(!snap.metadata.fromCache){clearTimeout(loadTimer);}
      if(saving||pending[k]) return;
      if(snap.exists){
        const incoming=normalize(snap.data());
        const same=JSON.stringify(incoming)===JSON.stringify(data);
        if(!snap.metadata.fromCache) setStatus('Synced ✓');
        if(same) return;                         // our own save echoing back: nothing to redraw
        data=incoming; localSet(k,data);
        const ae=document.activeElement;
        if(ae&&ae.closest&&ae.closest('#view')&&/INPUT/.test(ae.tagName)) { updateSummary(); return; }   // don't disturb typing
        render_keep();
      } else if(!snap.metadata.fromCache){
        if(data.tasks.length||Object.keys(data.exp).length){pending[k]=data;flush();}
        setStatus('Synced ✓');
      }
    },err=>{clearTimeout(loadTimer);setStatus('Saved on this device only');});
  }
  async function getMonth(y,m){
    const k=mkey(y,m);
    if(db&&uid){
      try{const s=await db.collection('data/users/'+uid).doc(k).get(); if(s.exists) return normalize(s.data());}catch(e){}
    }
    return localGet(k);
  }

  /* ---------- render ---------- */
  function render(){
    $('#mlabel').textContent=MN[M]+' '+Y;
    const v=$('#view'); v.textContent='';
    v.append(renderSheet());
    updateSummary();
    if(wantScroll){
      wantScroll=false;
      const sh=$('#sheet'); const tr=sh&&sh.querySelector(`tr[data-d="${isThisMonth()?now.getDate():1}"]`);
      if(sh&&tr) sh.scrollTop=Math.max(0,tr.offsetTop-90);
    }
  }
  function render_keep(){
    const sh=$('#sheet'); const l=sh?sh.scrollLeft:0, t=sh?sh.scrollTop:0;
    render();
    const n=$('#sheet'); if(n){n.scrollLeft=l;n.scrollTop=t;}
  }

  function renderSheet(){
    const N=dim(); if(selDay>N) selDay=N; if(selDay<1) selDay=1;
    const wrap=el('div');

    // summary tiles (filled by updateSummary)
    const st=el('div',{className:'stats'});
    [['stSpent','spent this month'],['stAvg','avg per day'],['stPct','tasks done'],['stNot','days not logged']].forEach(a=>{
      const d=el('div',{className:'stat'}); d.append(el('b',{id:a[0],textContent:'–'}),el('span',{textContent:a[1]})); st.append(d);
    });
    wrap.append(st);

    // toolbar
    const bar=el('form',{className:'bar'});
    const inp=el('input',{type:'text',placeholder:'New task column (e.g. Gym, Study)…',maxLength:60});
    const sc=el('select');
    [['month','Every day'],['onward','From selected row onward'],['day','Only selected row']].forEach(o=>sc.append(el('option',{value:o[0],textContent:o[1]})));
    bar.append(inp,sc,el('button',{type:'submit',className:'primary',textContent:'+ Add task'}));
    const fill=el('button',{type:'button',textContent:'Fill ₹0 in blank days'});
    bar.append(fill);
    bar.addEventListener('submit',e=>{
      e.preventDefault();
      const n=inp.value.trim(); if(!n) return;
      const t={id:uidn(),n,d:[],every:false,from:1,on:[],x:[]};
      if(sc.value==='day') t.on=[selDay]; else {t.every=true;t.from=sc.value==='month'?1:selDay;}
      data.tasks.push(t); touch(); render_keep();
      const i=$('#view .bar input[type=text]'); if(i) i.focus();
    });
    fill.addEventListener('click',()=>{
      const upto=isThisMonth()?now.getDate():(new Date(Y,M,1)>now?0:N);
      for(let d=1;d<=upto;d++) if(!logged(d)) data.exp[d]={e:'0',n:(data.exp[d]&&data.exp[d].n)||''};
      touch(); render_keep();
    });
    wrap.append(bar);
    const hint=el('div',{className:'hint',style:'margin-bottom:8px'});
    hint.textContent='Tick the boxes for each day. In the Spent column type a number or a sum like 120+50+30. Tap a hatched cell to add that task to that day. Tap a day to select its row.';
    wrap.append(hint);
    if(!data.tasks.length){
      const e=el('div',{className:'hint',style:'margin-bottom:8px'});
      const b=el('button',{type:'button',textContent:'Copy task columns from previous month'});
      b.addEventListener('click',async()=>{
        const pm=M===0?11:M-1, py=M===0?Y-1:Y;
        const p=await getMonth(py,pm);
        const list=p?p.tasks.filter(t=>t.every):[];
        if(!list.length){b.textContent='No every-day tasks found in '+MN[pm];return;}
        data.tasks=list.map(t=>({id:uidn(),n:t.n,d:[],every:true,from:1,on:[],x:[]}));
        touch(); render_keep();
      });
      e.append(b); wrap.append(e);
    }

    // the sheet
    const sheet=el('div',{className:'sheet',id:'sheet'});
    const tb=el('table');
    const hr=el('tr'); hr.append(el('th',{className:'corner',textContent:'Day'}));
    data.tasks.forEach(t=>{
      const th=el('th'); const hd=el('div',{className:'hd'});
      if(editId===t.id){
        const f=el('form',{style:'display:flex'}); const i=el('input',{type:'text',value:t.n,maxLength:60});
        const save=()=>{const v=i.value.trim(); if(v&&v!==t.n){t.n=v;touch();} editId=null; render_keep();};
        f.addEventListener('submit',ev=>{ev.preventDefault();save();});
        i.addEventListener('keydown',ev=>{if(ev.key==='Escape'){editId=null;render_keep();}});
        f.append(i); hd.append(f); setTimeout(()=>i.focus(),0);
      } else {
        const nm=el('button',{type:'button',className:'nm',textContent:t.n,title:'Click to rename'}); nm.dataset.ren=t.id;
        const x=el('button',{type:'button',className:'ghost',textContent:delArm===t.id?'Sure?':'✕',title:'Delete this task column'}); x.dataset.del=t.id;
        hd.append(nm,x);
      }
      th.append(hd); hr.append(th);
    });
    hr.append(el('th',{textContent:'Done'}),el('th',{textContent:'Spent (₹)',style:'min-width:104px'}),el('th',{textContent:'Details',style:'min-width:180px'}));
    tb.append(el('thead',null,hr));

    const body=el('tbody');
    for(let d=1;d<=N;d++){
      const dow=new Date(Y,M,d).getDay();
      const tr=el('tr'); tr.dataset.d=d;
      const cls=[]; if(dow===0||dow===6) cls.push('wk'); if(isThisMonth()&&d===now.getDate()) cls.push('tdy'); if(d===selDay) cls.push('sel');
      tr.className=cls.join(' ');
      const dc=el('td',{className:'day',textContent:d+' '+DW[dow]}); dc.dataset.sel=d; tr.append(dc);
      data.tasks.forEach(t=>{
        const td=el('td');
        if(applies(t,d)){
          td.className='ck';
          const cb=el('input',{type:'checkbox',checked:t.d.includes(d)}); cb.dataset.t=t.id; cb.dataset.d=d;
          cb.setAttribute('aria-label',t.n+' on day '+d); td.append(cb);
        } else {
          td.className='na'; td.title='Tap to add "'+t.n+'" on day '+d; td.dataset.add=t.id; td.dataset.d=d;
        }
        tr.append(td);
      });
      const dn=el('td',{className:'dn'}); dn.dataset.dday=d; tr.append(dn);
      const x=data.exp[d]||{e:'',n:''};
      const sp=el('td',{className:'sp'});
      const si=el('input',{type:'text',placeholder:'0',autocomplete:'off',inputMode:'text'});
      si.dataset.sp=d; si.dataset.e=x.e||'';
      const v=evalExpr(x.e); si.value=(v==null||isNaN(v))?(x.e||''):fmt(v);
      sp.append(si); tr.append(sp);
      const nt=el('td',{className:'nt'});
      const ni=el('input',{type:'text',placeholder:'',maxLength:120,value:x.n||''}); ni.dataset.nt=d;
      nt.append(ni); tr.append(nt);
      body.append(tr);
    }
    tb.append(body);

    const ft=el('tfoot'); const fr=el('tr');
    fr.append(el('td',{className:'day',textContent:'Total'}));
    data.tasks.forEach(t=>{const td=el('td'); td.dataset.tdone=t.id; fr.append(td);});
    const a=el('td'); a.id='sumDone'; const b=el('td'); b.id='sumSpent'; b.style.textAlign='right'; b.style.paddingRight='10px';
    fr.append(a,b,el('td'));
    ft.append(fr); tb.append(ft);
    sheet.append(tb); wrap.append(sheet);

    /* ----- events ----- */
    sheet.addEventListener('change',e=>{
      const t=e.target;
      if(t.dataset&&t.dataset.t&&t.type==='checkbox'){
        const task=data.tasks.find(x=>x.id===t.dataset.t); if(!task) return;
        const d=+t.dataset.d; task.d=task.d.filter(x=>x!==d); if(t.checked) task.d.push(d);
        touch(); updateSummary();
      } else if(t.dataset&&t.dataset.nt){
        const d=+t.dataset.nt; const x=data.exp[d]||(data.exp[d]={e:'',n:''});
        x.n=t.value.trim();
        if(!x.n&&!String(x.e).trim()) delete data.exp[d];
        touch();
      }
    });
    sheet.addEventListener('focusin',e=>{
      const t=e.target;
      if(t.dataset&&t.dataset.sp){
        t.value=t.dataset.e||''; setTimeout(()=>{ if(document.activeElement===t){ try{t.select();}catch(_){} } },0);
        selectRow(+t.dataset.sp);
      } else if(t.dataset&&t.dataset.nt){ selectRow(+t.dataset.nt); }
    });
    sheet.addEventListener('focusout',e=>{
      const t=e.target;
      if(!(t.dataset&&t.dataset.sp)) return;
      const d=+t.dataset.sp; const raw=t.value.trim().replace(/^=/,'');
      const prev=t.dataset.e||'';
      if(raw===''){
        t.dataset.e=''; t.value=''; t.classList.remove('bad');
        if(prev!==''){
          const x=data.exp[d]; if(x){x.e=''; if(!String(x.n).trim()) delete data.exp[d];}
          touch(); updateSummary();
        }
        return;
      }
      const v=evalExpr(raw);
      if(isNaN(v)){ t.classList.add('bad'); t.title='Use numbers and + - * / only'; return; }
      t.classList.remove('bad'); t.title='';
      t.dataset.e=raw; t.value=fmt(v);
      if(raw!==prev){
        const x=data.exp[d]||(data.exp[d]={e:'',n:''}); x.e=raw;
        touch(); updateSummary();
      }
    });
    sheet.addEventListener('keydown',e=>{
      const t=e.target;
      if(e.key==='Enter'&&t.dataset&&(t.dataset.sp||t.dataset.nt)){
        e.preventDefault();
        const d=+(t.dataset.sp||t.dataset.nt), attr=t.dataset.sp?'sp':'nt';
        const next=sheet.querySelector(`input[data-${attr}="${d+1}"]`);
        if(next) next.focus(); else t.blur();
      }
    });
    sheet.addEventListener('click',e=>{
      const r=e.target.closest('button[data-ren]');
      if(r){editId=r.dataset.ren;render_keep();return;}
      const x=e.target.closest('button[data-del]');
      if(x){
        const id=x.dataset.del;
        if(delArm===id){data.tasks=data.tasks.filter(t=>t.id!==id);delArm=null;touch();render_keep();}
        else{delArm=id;render_keep();setTimeout(()=>{if(delArm===id){delArm=null;render_keep();}},3000);}
        return;
      }
      const a=e.target.closest('td[data-add]');
      if(a){
        const t=data.tasks.find(z=>z.id===a.dataset.add); const d=+a.dataset.d;
        if(t){t.x=t.x.filter(v=>v!==d); if(!applies(t,d)) t.on.push(d); touch(); render_keep();}
        return;
      }
      const dc=e.target.closest('td[data-sel]');
      if(dc) selectRow(+dc.dataset.sel);
    });
    return wrap;
  }

  function selectRow(d){
    selDay=d;
    document.querySelectorAll('#sheet tbody tr.sel').forEach(r=>r.classList.remove('sel'));
    const r=document.querySelector(`#sheet tbody tr[data-d="${d}"]`); if(r) r.classList.add('sel');
  }

  function updateSummary(){
    const N=dim();
    const upto=isThisMonth()?now.getDate():(new Date(Y,M,1)>now?0:N);
    let spent=0, notLogged=0, ticks=0, planned=0;
    for(let d=1;d<=N;d++){
      spent+=spentOf(d);
      if(d<=upto&&!logged(d)) notLogged++;
      let a=0,c=0;
      data.tasks.forEach(t=>{ if(applies(t,d)){a++; if(t.d.includes(d)){c++;} if(d<=upto){planned++; if(t.d.includes(d)) ticks++;} } });
      const cell=document.querySelector(`td[data-dday="${d}"]`); if(cell) cell.textContent=a?(c+'/'+a):'–';
    }
    let allDone=0;
    data.tasks.forEach(t=>{
      const cnt=t.d.filter(d=>d<=N&&applies(t,d)).length; allDone+=cnt;
      const c=document.querySelector(`td[data-tdone="${t.id}"]`); if(c) c.textContent=cnt;
    });
    const set=(id,v)=>{const e=document.getElementById(id); if(e) e.textContent=v;};
    set('sumDone',allDone); set('sumSpent','₹'+fmt(spent));
    set('stSpent','₹'+fmt(spent));
    set('stAvg','₹'+fmt(upto?spent/upto:0));
    set('stPct',planned?Math.round(ticks/planned*100)+'%':'–');
    set('stNot',String(notLogged));
  }

  /* ---------- nav ---------- */
  function go(dm){
    M+=dm; if(M<0){M=11;Y--;} if(M>11){M=0;Y++;}
    delArm=null; editId=null; selDay=isThisMonth()?now.getDate():1; load();
  }
  $('#prev').onclick=()=>go(-1);
  $('#next').onclick=()=>go(1);
  $('#now').onclick=()=>{Y=now.getFullYear();M=now.getMonth();selDay=now.getDate();delArm=null;editId=null;load();};
  window.addEventListener('pagehide',()=>{if(Object.keys(pending).length)flush();});

  /* ---------- firestore adapter ---------- */
  const wrapSnap=s=>({exists:s.exists(),data:()=>s.data(),metadata:s.metadata});
  const adapter=u=>({collection:()=>({doc:k=>{
    const r=doc(fs,'users',u,'months',k);
    return {
      set:d=>setDoc(r,d),
      get:async()=>wrapSnap(await getDoc(r)),
      onSnapshot:(n,e)=>onSnapshot(r,{includeMetadataChanges:true},s=>n(wrapSnap(s)),e)
    };}})});

  /* ---------- backup ---------- */
  $('#exp').onclick=async()=>{
    if(!uid) return;
    try{
      const snap=await getDocs(collection(fs,'users',uid,'months'));
      const out={}; snap.forEach(d=>{out[d.id]=d.data();});
      const blob=new Blob([JSON.stringify(out,null,1)],{type:'application/json'});
      const a=el('a',{href:URL.createObjectURL(blob),download:'tracker-backup-'+new Date().toISOString().slice(0,10)+'.json'});
      document.body.append(a); a.click(); a.remove();
    }catch(e){setStatus('Export failed');}
  };
  $('#imp').onclick=()=>$('#impf').click();
  $('#impf').onchange=async e=>{
    const f=e.target.files[0]; e.target.value=''; if(!f||!uid) return;
    try{
      const obj=JSON.parse(await f.text()); let n=0;
      for(const k of Object.keys(obj)){
        if(!/^m-\d{4}-\d{2}$/.test(k)) continue;
        await setDoc(doc(fs,'users',uid,'months',k),normalize(obj[k])); n++;
      }
      setStatus('Imported '+n+' month(s)'); load();
    }catch(err){setStatus('Import failed — not a valid backup file');}
  };

  /* ---------- auth / boot ---------- */
  $('#gsign').onclick=async()=>{
    $('#lerr').textContent='';
    try{ await signInWithPopup(auth,new GoogleAuthProvider()); }
    catch(e){ $('#lerr').textContent=(e&&e.code==='auth/unauthorized-domain')
      ?'This website address is not authorised in Firebase yet (Authentication → Settings → Authorized domains).'
      :'Sign-in didn’t complete. Please try again.'; }
  };
  $('#out').onclick=async()=>{
    if(Object.keys(pending).length) await flush();
    if(unsub){unsub();unsub=null;}
    try{await signOut(auth);}catch(e){}
  };
  onAuthStateChanged(auth,u=>{
    $('#loading').hidden=true;
    if(u){
      uid=u.uid; db=adapter(uid);
      $('#login').hidden=true; $('#appRoot').hidden=false;
      $('#who').textContent='Signed in as '+(u.email||u.displayName||'you');
      setStatus('Connecting…'); load();
    } else {
      uid=null; db=null; if(unsub){unsub();unsub=null;}
      data={tasks:[],exp:{}}; setStatus('');
      $('#appRoot').hidden=true; $('#login').hidden=false;
    }
  });
})();
</script>
</body>
</html>
