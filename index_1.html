<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Daily Tracker</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2f7d5b">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{
  --bg:#f6f4ef;--card:#ffffff;--ink:#1f2421;--mute:#7a817c;--line:#e4e0d6;
  --accent:#2f7d5b;--accent-soft:#dff0e7;--warn:#c2562f;--today:#fff3cf;--wknd:#f4f1ea;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#161a18;--card:#1f2523;--ink:#ecefec;--mute:#8d9690;--line:#2e3633;
  --accent:#5bc196;--accent-soft:#1f3a2f;--warn:#e98a63;--today:#3a3320;--wknd:#232a27;}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:16px 14px 60px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:12px;justify-content:space-between;margin-bottom:14px}
h1{font-size:20px;margin:0;font-weight:650;letter-spacing:-.01em}
.month{display:flex;align-items:center;gap:6px}
.month .label{min-width:150px;text-align:center;font-weight:600;font-size:17px}
button{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:7px 12px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.ghost{border:none;background:none;color:var(--mute);padding:4px 8px}
button.ghost:hover{color:var(--warn)}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{border-radius:999px}
.tabs button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.status{font-size:12px;color:var(--mute)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
form.add{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
input[type=text],input[type=number],input[type=date]{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:8px 10px;min-width:0}
input:focus{outline:2px solid var(--accent);outline-offset:-1px}
form.add input[type=text]{flex:1 1 200px}
form.add input[type=number]{width:120px}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table.grid{border-collapse:separate;border-spacing:0;width:100%}
.grid th,.grid td{text-align:center;padding:0;border-bottom:1px solid var(--line);height:34px}
.grid thead th{font-size:11px;color:var(--mute);font-weight:500;height:30px;min-width:26px}
.grid .name{position:sticky;left:0;z-index:2;background:var(--card);text-align:left;padding:0 10px;min-width:150px;max-width:200px;border-right:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.grid .cnt{position:sticky;right:0;background:var(--card);border-left:1px solid var(--line);padding:0 8px;min-width:74px;font-size:12px;color:var(--mute);white-space:nowrap}
.grid tr:last-child td{border-bottom:none}
.grid .wk{background:var(--wknd)}
.grid .td{background:var(--today)}
.grid thead .td{color:var(--ink);font-weight:700}
.grid thead .sel{box-shadow:inset 0 -3px var(--accent);color:var(--ink)}
select{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:8px 10px}
.grid input[type=checkbox]{width:17px;height:17px;accent-color:var(--accent);cursor:pointer;vertical-align:middle;margin:0}
.bar{display:inline-block;width:34px;height:5px;background:var(--line);border-radius:4px;vertical-align:middle;margin-right:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.empty{color:var(--mute);text-align:center;padding:28px 10px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:12px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-size:20px;letter-spacing:-.01em}
.stat span{font-size:12px;color:var(--mute)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:760px){.two{grid-template-columns:1fr}.month .label{min-width:120px}}
ul.list{list-style:none;margin:0;padding:0}
ul.list li{display:flex;align-items:center;gap:8px;padding:8px 2px;border-bottom:1px solid var(--line)}
ul.list li:last-child{border-bottom:none}
ul.list .t{flex:1;overflow-wrap:anywhere}
ul.list .a{font-variant-numeric:tabular-nums;font-weight:600}
.days div{display:grid;grid-template-columns:44px 1fr 86px;gap:8px;align-items:center;padding:5px 6px;border-radius:8px;cursor:pointer;font-size:13px}
.days div:hover{background:var(--accent-soft)}
.days div.sel{background:var(--accent-soft);outline:1px solid var(--accent)}
.days .m{height:7px;background:var(--line);border-radius:5px;overflow:hidden}
.days .m i{display:block;height:100%;background:var(--accent);border-radius:5px}
.days .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--mute)}
h2{font-size:15px;margin:0 0 10px}
.note{font-size:12px;color:var(--mute);margin-top:10px}
.sub{color:var(--mute);font-weight:400;font-size:13px}
[hidden]{display:none!important}
.loginbox{max-width:380px;margin:12vh auto 0;text-align:center}
.loginbox h1{font-size:24px;margin-bottom:6px}
.loginbox p{color:var(--mute);margin:0 0 20px}
.gbtn{display:inline-flex;align-items:center;gap:10px;padding:11px 18px;font-weight:600;border-radius:10px}
.err{color:var(--warn);font-size:13px;margin-top:12px;min-height:18px}
.foot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:26px;padding-top:14px;border-top:1px solid var(--line);font-size:13px;color:var(--mute)}
.foot .sp{flex:1}
</style>
</head>
<body>
<div class="wrap" id="loading"><div class="empty">Loading\u2026</div></div>
<div class="wrap" id="login" hidden>
  <div class="card loginbox">
    <h1>My Daily Tracker</h1>
    <p>Daily tasks and expenses, saved to your account.</p>
    <button id="gsign" class="gbtn" type="button">
      <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.2C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.4c-.5 2.9-2.2 5.3-4.6 6.9l7.4 5.8c4.3-4 6.9-9.9 6.9-17.2z"/><path fill="#FBBC05" d="M10.5 28.6c-.5-1.4-.8-2.9-.8-4.6s.3-3.2.8-4.6l-7.9-6.2C.9 16.4 0 20.1 0 24s.9 7.6 2.6 10.8l7.9-6.2z"/><path fill="#34A853" d="M24 48c6.3 0 11.6-2.1 15.5-5.7l-7.4-5.8c-2.1 1.4-4.8 2.3-8.1 2.3-6.3 0-11.6-4.1-13.5-9.9l-7.9 6.2C6.5 42.6 14.6 48 24 48z"/></svg>
      Continue with Google
    </button>
    <div class="err" id="lerr"></div>
  </div>
</div>
<div class="wrap" id="appRoot" hidden>
  <header>
    <h1>My Daily Tracker</h1>
    <div class="month">
      <button id="prev" aria-label="Previous month">&larr;</button>
      <div class="label" id="mlabel"></div>
      <button id="next" aria-label="Next month">&rarr;</button>
      <button id="now" class="ghost">Today</button>
    </div>
    <div class="status" id="status"></div>
  </header>
  <div class="tabs">
    <button id="tab-tasks" class="on">Tasks</button>
    <button id="tab-exp">Expenses</button>
  </div>
  <main id="view"></main>
  <div class="foot">
    <span id="who"></span><span class="sp"></span>
    <button id="exp" type="button">Export backup</button>
    <button id="imp" type="button">Import backup</button>
    <input id="impf" type="file" accept="application/json" hidden>
    <button id="out" type="button">Sign out</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, onAuthStateChanged, GoogleAuthProvider, signInWithPopup, signOut } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { initializeFirestore, getFirestore, persistentLocalCache, persistentMultipleTabManager, doc, collection, setDoc, getDoc, getDocs, onSnapshot } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDg3wi9f80kDwH5Ano4e6qokenHHL4IAD8",
  authDomain: "my-tracker1-e12cd.firebaseapp.com",
  projectId: "my-tracker1-e12cd",
  storageBucket: "my-tracker1-e12cd.firebasestorage.app",
  messagingSenderId: "638714042761",
  appId: "1:638714042761:web:6cbf42f3dbd6eec784a958"
};
const fbApp = initializeApp(firebaseConfig);
const auth = getAuth(fbApp);
let fs;
try { fs = initializeFirestore(fbApp, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) }); }
catch (e) { fs = getFirestore(fbApp); }

if ('serviceWorker' in navigator) { window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {})); }

(function(){
  const MN=['January','February','March','April','May','June','July','August','September','October','November','December'];
  const $=s=>document.querySelector(s);
  const now=new Date();
  let Y=now.getFullYear(), M=now.getMonth(), tab='tasks';
  let selDay=now.getDate();
  let data={tasks:[],exp:{}};
  let db=null, uid=null, unsub=null, saving=false, timer=null, loadTimer=null;
  const pending={};           // month key -> data object waiting to be saved
  let delArm=null, editId=null;

  const mkey=(y,m)=>`m-${y}-${String(m+1).padStart(2,'0')}`;
  const key=()=>mkey(Y,M);
  const dim=()=>new Date(Y,M+1,0).getDate();
  const isThisMonth=()=>Y===now.getFullYear()&&M===now.getMonth();
  const money=n=>'₹'+(Math.round(n*100)/100).toLocaleString('en-IN',{maximumFractionDigits:2});
  const uidn=()=>Math.random().toString(36).slice(2,9);
  const el=(t,props,...kids)=>{const e=document.createElement(t);if(props)Object.assign(e,props);kids.forEach(k=>e.append(k));return e;};

  function normalize(d){
    d=d||{};
    const arr=a=>Array.isArray(a)?a.map(Number):[];
    return {tasks:Array.isArray(d.tasks)?d.tasks.map(t=>{
              const legacy=t.every===undefined&&t.on===undefined;
              return {id:String(t.id||uidn()),n:String(t.n||''),d:arr(t.d),every:legacy?true:!!t.every,from:+t.from||1,on:arr(t.on),x:arr(t.x)};
            }):[],
            exp:(d.exp&&typeof d.exp==='object')?d.exp:{}};
  }
  function localGet(k){try{const s=localStorage.getItem('trk:'+(uid||'')+':'+k);return s?normalize(JSON.parse(s)):null;}catch(e){return null;}}
  function localSet(k,v){try{localStorage.setItem('trk:'+(uid||'')+':'+k,JSON.stringify(v));}catch(e){}}

  /* ---------- saving ---------- */
  function setStatus(s){$('#status').textContent=s;}
  function touch(){
    pending[key()]=data;
    localSet(key(),data);
    setStatus(db&&uid?'Saving…':'Saved on this device');
    clearTimeout(timer); timer=setTimeout(flush,500);
  }
  async function flush(){
    if(saving) return;
    const keys=Object.keys(pending);
    if(!keys.length) return;
    saving=true;
    let ok=true;
    for(const k of keys){
      const d=pending[k]; delete pending[k];
      try{
        if(db&&uid) await db.collection('data/users/'+uid).doc(k).set(JSON.parse(JSON.stringify(d)));
      }catch(e){ok=false;}
    }
    saving=false;
    if(Object.keys(pending).length) return flush();
    setStatus(db&&uid?(ok?'Saved ✓':'Sync failed — kept on this device'):'Saved on this device');
  }

  /* ---------- loading ---------- */
  function load(){
    if(unsub){unsub();unsub=null;}
    data=pending[key()]||localGet(key())||{tasks:[],exp:{}};
    render();
    if(!(db&&uid)) return;
    clearTimeout(loadTimer);
    loadTimer=setTimeout(()=>setStatus('Can’t reach saved data yet…'),10000);
    const k=key();
    unsub=db.collection('data/users/'+uid).doc(k).onSnapshot(snap=>{
      if(k!==key()) return;
      if(!snap.metadata.fromCache){clearTimeout(loadTimer);}
      if(saving||pending[k]) return;
      if(snap.exists){
        data=normalize(snap.data()); localSet(k,data); render();
        if(!snap.metadata.fromCache) setStatus('Synced ✓');
      } else if(!snap.metadata.fromCache){
        // nothing stored yet; push what's on this device (if any) up once
        if(data.tasks.length||Object.keys(data.exp).length){pending[k]=data;flush();}
        setStatus('Synced ✓');
      }
    },err=>{clearTimeout(loadTimer);setStatus('Saved on this device only');});
  }

  async function getMonth(y,m){
    const k=mkey(y,m);
    if(db&&uid){
      try{const s=await db.collection('data/users/'+uid).doc(k).get(); if(s.exists) return normalize(s.data());}catch(e){}
    }
    return localGet(k);
  }

  /* ---------- helpers ---------- */
  function dayTotal(d){return (data.exp[d]||[]).reduce((s,x)=>s+(+x.a||0),0);}
  function monthTotal(){let s=0;for(const d in data.exp)s+=dayTotal(d);return s;}

  /* ---------- render ---------- */
  function render(){
    $('#mlabel').textContent=MN[M]+' '+Y;
    $('#tab-tasks').classList.toggle('on',tab==='tasks');
    $('#tab-exp').classList.toggle('on',tab==='exp');
    const v=$('#view'); v.textContent='';
    v.append(tab==='tasks'?renderTasks():renderExp());
  }

  function applies(t,d){return t.on.includes(d)||(t.every&&d>=t.from&&!t.x.includes(d));}
  function toggle(tid,d,on){
    const t=data.tasks.find(x=>x.id===tid); if(!t) return;
    t.d=t.d.filter(x=>x!==d); if(on) t.d.push(d);
    touch();
  }
  function dayLabel(){return ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][new Date(Y,M,selDay).getDay()]+', '+selDay+' '+MN[M]+(isThisMonth()&&selDay===now.getDate()?' (today)':'');}

  function renderTasks(){
    const N=dim(); if(selDay>N)selDay=N; if(selDay<1)selDay=1;
    const wrap=el('div');

    /* ----- day card ----- */
    const card=el('div',{className:'card',style:'margin-bottom:14px'});
    const head=el('div',{className:'row'});
    const nav=el('div',{className:'month'});
    const pb=el('button',{textContent:'←',title:'Previous day'}), nb=el('button',{textContent:'→',title:'Next day'});
    pb.onclick=()=>{if(selDay>1){selDay--;editId=null;render();}};
    nb.onclick=()=>{if(selDay<N){selDay++;editId=null;render();}};
    nav.append(pb,el('div',{className:'label',style:'min-width:190px',textContent:dayLabel()}),nb);
    const list=data.tasks.filter(t=>applies(t,selDay));
    const doneN=list.filter(t=>t.d.includes(selDay)).length;
    head.append(nav,el('span',{className:'sub',textContent:list.length?doneN+' of '+list.length+' done':'No tasks on this day'}));
    card.append(head);

    const form=el('form',{className:'add'});
    const inp=el('input',{type:'text',placeholder:'Add a task for this day…',maxLength:80});
    const sc=el('select');
    [['day','Only this day'],['onward','This day onward (rest of month)'],['month','Every day of the month']].forEach(o=>sc.append(el('option',{value:o[0],textContent:o[1]})));
    form.append(inp,sc,el('button',{type:'submit',className:'primary',textContent:'Add task'}));
    form.addEventListener('submit',e=>{
      e.preventDefault();
      const n=inp.value.trim(); if(!n) return;
      const t={id:uidn(),n,d:[],every:false,from:1,on:[],x:[]};
      if(sc.value==='day') t.on=[selDay]; else {t.every=true;t.from=sc.value==='month'?1:selDay;}
      data.tasks.push(t); touch(); render();
      const i=$('#view form.add input[type=text]'); if(i) i.focus();
    });
    card.append(form);

    if(!list.length){
      card.append(el('div',{className:'empty',style:'padding:14px',textContent:'Nothing planned for this day. Add a task above.'}));
    } else {
      const ul=el('ul',{className:'list'});
      list.forEach(t=>{
        const li=el('li');
        const cb=el('input',{type:'checkbox',checked:t.d.includes(selDay),style:'width:20px;height:20px;accent-color:var(--accent)'});
        cb.dataset.dayt=t.id; li.append(cb);
        if(editId===t.id){
          const f=el('form',{style:'flex:1;display:flex;gap:6px'});
          const i=el('input',{type:'text',value:t.n,maxLength:80,style:'flex:1'});
          f.append(i,el('button',{type:'submit',className:'primary',textContent:'Save'}));
          const save=()=>{const v=i.value.trim(); if(v&&v!==t.n){t.n=v;touch();} editId=null; render();};
          f.addEventListener('submit',e=>{e.preventDefault();save();});
          i.addEventListener('keydown',e=>{if(e.key==='Escape'){editId=null;render();}});
          li.append(f); setTimeout(()=>i.focus(),0);
        } else {
          li.append(el('span',{className:'t',textContent:t.n,style:t.d.includes(selDay)?'text-decoration:line-through;color:var(--mute)':''}));
          const scope=t.on.includes(selDay)&&!(t.every&&selDay>=t.from)?'this day':(t.every?(t.from===1?'every day':'from day '+t.from):'this day');
          li.append(el('span',{className:'sub',textContent:scope}));
          const e1=el('button',{className:'ghost',textContent:'✎',title:'Rename'}); e1.dataset.edit=t.id;
          const x1=el('button',{className:'ghost',textContent:'✕',title:'Remove from this day'}); x1.dataset.rm=t.id;
          li.append(e1,x1);
        }
        ul.append(li);
      });
      card.append(ul);
    }
    card.addEventListener('change',e=>{
      const id=e.target.dataset&&e.target.dataset.dayt; if(!id) return;
      toggle(id,selDay,e.target.checked); render();
    });
    card.addEventListener('click',e=>{
      const b=e.target.closest('button'); if(!b) return;
      if(b.dataset.edit){editId=b.dataset.edit;render();}
      if(b.dataset.rm){
        const t=data.tasks.find(x=>x.id===b.dataset.rm); if(!t) return;
        t.on=t.on.filter(x=>x!==selDay);
        if(t.every&&selDay>=t.from&&!t.x.includes(selDay)) t.x.push(selDay);
        t.d=t.d.filter(x=>x!==selDay);
        touch(); render();
      }
    });
    wrap.append(card);

    /* ----- month grid ----- */
    if(!data.tasks.length){
      const box=el('div',{className:'card empty'});
      box.append(el('div',{textContent:'No tasks for this month yet.'}));
      const b=el('button',{textContent:'Copy tasks from previous month',style:'margin-top:12px'});
      b.addEventListener('click',async()=>{
        const pm=M===0?11:M-1, py=M===0?Y-1:Y;
        const p=await getMonth(py,pm);
        if(!p||!p.tasks.length){b.textContent='Nothing to copy from '+MN[pm];return;}
        data.tasks=p.tasks.filter(t=>t.every).map(t=>({id:uidn(),n:t.n,d:[],every:true,from:1,on:[],x:[]}));
        if(!data.tasks.length){b.textContent='No every-day tasks in '+MN[pm];return;}
        touch(); render();
      });
      box.append(el('div'),b); wrap.append(box); return wrap;
    }

    let ticks=0, possible=0;
    const upto=isThisMonth()?now.getDate():(new Date(Y,M,1)>now?0:N);
    data.tasks.forEach(t=>{ticks+=t.d.length; for(let d=1;d<=upto;d++) if(applies(t,d)) possible++;});
    const st=el('div',{className:'stats'});
    const stat=(b,s)=>{const d=el('div',{className:'stat'});d.append(el('b',{textContent:b}),el('span',{textContent:s}));return d;};
    st.append(stat(ticks+' ticks','completed this month'),
              stat(possible?Math.round(ticks/possible*100)+'%':'—','of planned tasks done so far'),
              stat(String(data.tasks.length),'tasks this month'));
    wrap.append(st);

    const scr=el('div',{className:'scroll'});
    const tb=el('table',{className:'grid'});
    const hr=el('tr'); hr.append(el('th',{className:'name',textContent:'Task'}));
    for(let d=1;d<=N;d++){
      const dow=new Date(Y,M,d).getDay();
      const th=el('th',{textContent:d,style:'cursor:pointer'});
      th.dataset.day=d;
      let c=''; if(isThisMonth()&&d===now.getDate())c='td'; else if(dow===0||dow===6)c='wk';
      if(d===selDay)c+=' sel'; th.className=c.trim();
      hr.append(th);
    }
    hr.append(el('th',{className:'cnt',textContent:'Done'}));
    tb.append(el('thead',null,hr));
    const body=el('tbody');
    data.tasks.forEach(t=>{
      const tr=el('tr');
      tr.append(el('td',{className:'name',title:t.n,textContent:t.n}));
      let ap=0;
      for(let d=1;d<=N;d++){
        const dow=new Date(Y,M,d).getDay();
        const td=el('td'); if(isThisMonth()&&d===now.getDate())td.className='td'; else if(dow===0||dow===6)td.className='wk';
        if(applies(t,d)){
          ap++;
          const cb=el('input',{type:'checkbox',checked:t.d.includes(d)});
          cb.dataset.t=t.id; cb.dataset.d=d; cb.setAttribute('aria-label',t.n+' day '+d); td.append(cb);
        } else {
          const dot=el('button',{className:'ghost',textContent:'·',title:'Add this task to day '+d,style:'padding:0 6px'});
          dot.dataset.add=t.id; dot.dataset.d=d; td.append(dot);
        }
        tr.append(td);
      }
      const c=el('td',{className:'cnt'});
      const bar=el('span',{className:'bar'}); const fill=el('i'); fill.style.width=(ap?Math.round(t.d.length/ap*100):0)+'%'; bar.append(fill);
      c.append(bar,el('span',{textContent:t.d.length+'/'+ap}));
      const x=el('button',{className:'ghost',textContent:delArm===t.id?'Sure?':'✕',title:'Delete task from the whole month'});
      x.dataset.del=t.id; c.append(x); tr.append(c);
      body.append(tr);
    });
    tb.append(body); scr.append(tb); wrap.append(scr);
    wrap.append(el('div',{className:'note',textContent:'Tap a day number to jump to that day. Tap a · to add a task to that day. ✕ at the end deletes the task from the whole month.'}));

    scr.addEventListener('change',e=>{
      const cb=e.target; if(!cb.dataset.t) return;
      toggle(cb.dataset.t,+cb.dataset.d,cb.checked); render_keepScroll(scr);
    });
    scr.addEventListener('click',e=>{
      const th=e.target.closest('th[data-day]');
      if(th){selDay=+th.dataset.day;editId=null;render();window.scrollTo(0,0);return;}
      const a=e.target.closest('button[data-add]');
      if(a){const t=data.tasks.find(x=>x.id===a.dataset.add); const d=+a.dataset.d;
        if(t){t.x=t.x.filter(v=>v!==d); if(!applies(t,d)) t.on.push(d); touch(); render_keepScroll(scr);} return;}
      const b=e.target.closest('button[data-del]'); if(!b) return;
      const id=b.dataset.del;
      if(delArm===id){data.tasks=data.tasks.filter(x=>x.id!==id);delArm=null;touch();render();}
      else{delArm=id;render_keepScroll(scr);setTimeout(()=>{if(delArm===id){delArm=null;render();}},3000);}
    });
    return wrap;
  }
  function render_keepScroll(sc){
    const x=sc.scrollLeft, y=window.scrollY; render();
    const n=$('#view .scroll'); if(n) n.scrollLeft=x; window.scrollTo(0,y);
  }

  function renderExp(){
    const N=dim(); if(selDay>N) selDay=N; if(selDay<1) selDay=1;
    const wrap=el('div');
    const items=data.exp[selDay]||[];
    const mt=monthTotal();
    const spentDays=Object.keys(data.exp).filter(d=>dayTotal(d)>0);
    const elapsed=isThisMonth()?now.getDate():N;
    let top=0,topD=0; spentDays.forEach(d=>{const t=dayTotal(d);if(t>top){top=t;topD=d;}});

    const st=el('div',{className:'stats'});
    const stat=(b,s)=>{const d=el('div',{className:'stat'});d.append(el('b',{textContent:b}),el('span',{textContent:s}));return d;};
    const unlogged=Array.from({length:isThisMonth()?now.getDate():(new Date(Y,M,1)>now?0:N)},(_,i)=>i+1).filter(d=>!(data.exp[d]||[]).length).length;
    st.append(stat(money(mt),'spent in '+MN[M]),stat(String(unlogged),'days not logged yet'),
              stat(money(elapsed?mt/elapsed:0),'average per day'),
              stat(top?money(top):'—',top?'highest day ('+topD+' '+MN[M].slice(0,3)+')':'highest day'));
    wrap.append(st);

    const two=el('div',{className:'two'});

    // left: day entry
    const left=el('div',{className:'card'});
    const dt=el('input',{type:'date',value:`${Y}-${String(M+1).padStart(2,'0')}-${String(selDay).padStart(2,'0')}`});
    dt.addEventListener('change',()=>{
      const p=dt.value.split('-').map(Number); if(p.length!==3||!p[0]) return;
      const ch=(p[0]!==Y||p[1]-1!==M); Y=p[0];M=p[1]-1;selDay=p[2];
      if(ch) load(); else render();
    });
    const head=el('div',{className:'row'});
    head.append(el('h2',{textContent:'Expenses for',style:'margin:0'}),dt);
    left.append(head);
    const form=el('form',{className:'add'});
    const what=el('input',{type:'text',placeholder:'What for? (lunch, auto, groceries)',maxLength:60});
    const amt=el('input',{type:'number',placeholder:'Amount',min:'0',step:'any',inputMode:'decimal'});
    form.append(what,amt,el('button',{type:'submit',className:'primary',textContent:'Add'}));
    form.addEventListener('submit',e=>{
      e.preventDefault();
      const a=parseFloat(amt.value); if(!(a>=0)||isNaN(a)) {amt.focus();return;}
      (data.exp[selDay]=data.exp[selDay]||[]).push({id:uidn(),t:what.value.trim()||'Expense',a});
      touch(); render();
      const w=$('#view form.add input[type=text]'); if(w) w.focus();
    });
    left.append(form);
    if(!items.length){
      left.append(el('div',{className:'empty',textContent:'Nothing logged for this day yet.',style:'padding:14px 14px 8px'}));
      const z=el('button',{textContent:'No spending today \u2014 log \u20B90',style:'display:block;margin:0 auto 12px'});
      z.addEventListener('click',()=>{(data.exp[selDay]=data.exp[selDay]||[]).push({id:uidn(),t:'No spending',a:0});touch();render();});
      left.append(z);
      left.append(el('div',{className:'row',style:'margin:10px 0 0;padding-top:10px;border-top:1px solid var(--line)'},
        el('b',{textContent:'Day total'}),el('b',{textContent:money(0)})));
    } else {
      const ul=el('ul',{className:'list'});
      items.forEach(x=>{
        const li=el('li'); li.append(el('span',{className:'t',textContent:x.t}),el('span',{className:'a',textContent:money(x.a)}));
        const b=el('button',{className:'ghost',textContent:'✕',title:'Remove'});
        b.addEventListener('click',()=>{data.exp[selDay]=items.filter(y=>y.id!==x.id);if(!data.exp[selDay].length)delete data.exp[selDay];touch();render();});
        li.append(b); ul.append(li);
      });
      left.append(ul);
      left.append(el('div',{className:'row',style:'margin:10px 0 0;padding-top:10px;border-top:1px solid var(--line)'},
        el('b',{textContent:'Day total'}),el('b',{textContent:money(dayTotal(selDay))})));
    }
    two.append(left);

    // right: month overview
    const right=el('div',{className:'card'});
    right.append(el('h2',{textContent:'Day by day'}));
    const maxT=Math.max(1,...Array.from({length:N},(_,i)=>dayTotal(i+1)));
    const days=el('div',{className:'days'});
    for(let d=1;d<=N;d++){
      const t=dayTotal(d);
      const r=el('div',{className:d===selDay?'sel':''});
      const dow=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][new Date(Y,M,d).getDay()];
      r.append(el('span',{textContent:d+' '+dow.slice(0,2)}));
      const m=el('div',{className:'m'}); const i=el('i'); i.style.width=(t/maxT*100)+'%'; m.append(i); r.append(m);
      const logged=(data.exp[d]||[]).length>0;
      r.append(el('span',{className:'v',textContent:(logged?'✓ ':'')+money(t),style:logged?'color:var(--ink)':'opacity:.55'}));
      r.addEventListener('click',()=>{selDay=d;render();});
      days.append(r);
    }
    right.append(days);
    two.append(right);
    wrap.append(two);
    return wrap;
  }

  /* ---------- nav ---------- */
  function go(dm){
    M+=dm; if(M<0){M=11;Y--;} if(M>11){M=0;Y++;}
    delArm=null; selDay=isThisMonth()?now.getDate():1; load();
  }
  $('#prev').onclick=()=>go(-1);
  $('#next').onclick=()=>go(1);
  $('#now').onclick=()=>{Y=now.getFullYear();M=now.getMonth();selDay=now.getDate();delArm=null;load();};
  $('#tab-tasks').onclick=()=>{tab='tasks';render();};
  $('#tab-exp').onclick=()=>{tab='exp';render();};
  window.addEventListener('pagehide',()=>{if(Object.keys(pending).length)flush();});

  /* ---------- firestore adapter ---------- */
  const wrapSnap=s=>({exists:s.exists(),data:()=>s.data(),metadata:s.metadata});
  const adapter=u=>({collection:()=>({doc:k=>{
    const r=doc(fs,'users',u,'months',k);
    return {
      set:d=>setDoc(r,d),
      get:async()=>wrapSnap(await getDoc(r)),
      onSnapshot:(n,e)=>onSnapshot(r,{includeMetadataChanges:true},s=>n(wrapSnap(s)),e)
    };}})});

  /* ---------- backup ---------- */
  $('#exp').onclick=async()=>{
    if(!uid) return;
    try{
      const snap=await getDocs(collection(fs,'users',uid,'months'));
      const out={}; snap.forEach(d=>{out[d.id]=d.data();});
      const blob=new Blob([JSON.stringify(out,null,1)],{type:'application/json'});
      const a=el('a',{href:URL.createObjectURL(blob),download:'tracker-backup-'+new Date().toISOString().slice(0,10)+'.json'});
      document.body.append(a); a.click(); a.remove();
    }catch(e){setStatus('Export failed');}
  };
  $('#imp').onclick=()=>$('#impf').click();
  $('#impf').onchange=async e=>{
    const f=e.target.files[0]; e.target.value=''; if(!f||!uid) return;
    try{
      const obj=JSON.parse(await f.text()); let n=0;
      for(const k of Object.keys(obj)){
        if(!/^m-\d{4}-\d{2}$/.test(k)) continue;
        await setDoc(doc(fs,'users',uid,'months',k),normalize(obj[k])); n++;
      }
      setStatus('Imported '+n+' month(s)'); load();
    }catch(err){setStatus('Import failed \u2014 not a valid backup file');}
  };

  /* ---------- auth / boot ---------- */
  $('#gsign').onclick=async()=>{
    $('#lerr').textContent='';
    try{ await signInWithPopup(auth,new GoogleAuthProvider()); }
    catch(e){ $('#lerr').textContent=(e&&e.code==='auth/unauthorized-domain')
      ?'This website address is not authorised in Firebase yet (Authentication \u2192 Settings \u2192 Authorized domains).'
      :'Sign-in didn\u2019t complete. Please try again.'; }
  };
  $('#out').onclick=async()=>{
    if(Object.keys(pending).length) await flush();
    if(unsub){unsub();unsub=null;}
    try{await signOut(auth);}catch(e){}
  };
  onAuthStateChanged(auth,u=>{
    $('#loading').hidden=true;
    if(u){
      uid=u.uid; db=adapter(uid);
      $('#login').hidden=true; $('#appRoot').hidden=false;
      $('#who').textContent='Signed in as '+(u.email||u.displayName||'you');
      setStatus('Connecting\u2026'); load();
    } else {
      uid=null; db=null; if(unsub){unsub();unsub=null;}
      data={tasks:[],exp:{}}; setStatus('');
      $('#appRoot').hidden=true; $('#login').hidden=false;
    }
  });
})();
</script>
</body>
</html>
